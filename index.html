<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IstikharaSite | Online Islamic Spiritual Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Amiri:wght@400;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --deep-green: #013220;
        --gold: #D4AF37;
        --gold-light: #fcf6ba;
        --wa-green: #25D366;
      }

      /* Hard-coded Typography & Layout Fixes */
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: hidden !important;
        overflow-y: visible !important;
        background-color: var(--deep-green);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Global Urdu Text Fix for all occurrences including dynamic fonts */
      .urdu-text, 
      [style*="Noto Nastaliq Urdu"],
      [style*="font-urdu"],
      .font-urdu {
        font-family: 'Noto Nastaliq Urdu', serif !important;
        line-height: 2.5 !important; 
        padding-bottom: 35px !important;
        margin-bottom: -20px !important;
        overflow: visible !important;
        text-rendering: optimizeLegibility;
        direction: rtl;
        display: block;
      }

      .bg-islamic {
        background-color: var(--deep-green);
        background-image: url("https://www.transparenttextures.com/patterns/arabesque.png");
        background-attachment: fixed;
      }
      
      .custom-cursor-dot {
        position: fixed;
        top: 0;
        left: 0;
        width: 8px;
        height: 8px;
        background-color: var(--gold);
        border-radius: 50%;
        pointer-events: none;
        z-index: 10000;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 10px var(--gold);
      }

      .custom-cursor-trailer {
        position: fixed;
        top: 0;
        left: 0;
        width: 40px;
        height: 40px;
        border: 1px solid rgba(212, 175, 55, 0.5);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
      }

      @media (pointer: fine) {
        body.has-custom-cursor, 
        body.has-custom-cursor * {
          cursor: none !important;
        }
      }

      .text-gold {
        background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fcf6ba, #aa771c);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .reveal {
        opacity: 0;
        transform: translateY(30px);
        transition: all 0.8s cubic-bezier(0.165, 0.84, 0.44, 1);
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }

      .golden-glow {
        filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4));
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--deep-green);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--gold);
        border-radius: 4px;
      }

      @keyframes pulse-gold {
        0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7); }
        70% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
        100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
      }
      .pulse-gold {
        animation: pulse-gold 2s infinite;
      }

      @keyframes wa-pulse {
        0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.8); }
        70% { box-shadow: 0 0 0 20px rgba(212, 175, 55, 0); }
        100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
      }
      .wa-pulse-gold {
        animation: wa-pulse 2.5s infinite;
      }
    </style>

    <!-- Polyfill for process.env - Critical for Vercel/Client-side SDK stability -->
    <script>
      window.process = window.process || { env: { API_KEY: "" } };
    </script>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.2.4",
        "react/": "https://esm.sh/react@19.2.4/",
        "react-dom": "https://esm.sh/react-dom@19.2.4",
        "react-dom/": "https://esm.sh/react-dom@19.2.4/",
        "react-dom/client": "https://esm.sh/react-dom@19.2.4/client",
        "@google/genai": "https://esm.sh/@google/genai@1.41.0"
      }
    }
    </script>
  </head>
  <body class="bg-islamic text-gray-100 min-h-screen">
    <!-- Main mounting point -->
    <div id="root"></div>

    <!-- UI Logic Scripts -->
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const observerOptions = { threshold: 0.1 };
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('active');
            }
          });
        }, observerOptions);

        window.initScrollReveal = () => {
          document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        };
      });
    </script>

    <!-- Entry module - Using relative path for Vite/Vercel compatibility -->
    <script type="module" src="./index.tsx"></script>
  </body>
</html>

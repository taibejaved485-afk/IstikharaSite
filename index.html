<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IstikharaSite | Online Islamic Spiritual Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Amiri:wght@400;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --deep-green: #013220;
        --gold: #D4AF37;
        --gold-light: #fcf6ba;
      }

      .font-urdu { font-family: 'Noto Nastaliq Urdu', serif; }
      .font-arabic { font-family: 'Amiri', serif; }
      .font-title { font-family: 'Playfair Display', serif; }
      
      .urdu-text {
        font-family: 'Noto Nastaliq Urdu', serif;
        /* THE SPECIFIC FIX: Ensure nuqtas (dots) never cut off */
        line-height: 2.2 !important;
        padding-bottom: 25px !important;
        overflow: visible !important;
        text-rendering: optimizeLegibility;
        direction: rtl;
        display: block;
      }

      .bg-islamic {
        background-color: var(--deep-green);
        background-image: url("https://www.transparenttextures.com/patterns/arabesque.png");
        background-attachment: fixed;
      }
      
      .text-gold {
        background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fcf6ba, #aa771c);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Premium Shine Animation */
      @keyframes shine {
        0% { left: -100%; }
        20% { left: 100%; }
        100% { left: 100%; }
      }
      .hover-shine {
        position: relative;
        overflow: hidden;
      }
      .hover-shine::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 50%;
        height: 100%;
        background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.3), transparent);
        transform: skewX(-25deg);
      }
      .hover-shine:hover::after {
        animation: shine 1.5s infinite;
      }

      /* Scroll Reveal */
      .reveal {
        opacity: 0;
        transform: translateY(30px);
        transition: all 0.8s cubic-bezier(0.165, 0.84, 0.44, 1);
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }

      /* Golden Glow */
      .golden-glow {
        filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4));
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--deep-green);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--gold);
        border-radius: 4px;
      }
      
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(212, 175, 55, 0.3);
        border-radius: 10px;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }

      @keyframes pulse-gold {
        0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7); }
        70% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
        100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
      }
      .pulse-gold {
        animation: pulse-gold 2s infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
</head>
  <body class="bg-islamic text-gray-100 min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const observerOptions = { threshold: 0.1 };
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('active');
            }
          });
        }, observerOptions);

        window.initScrollReveal = () => {
          document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        };
      });
    </script>
  </body>
</html>
